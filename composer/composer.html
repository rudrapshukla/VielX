<!DOCTYPE html>
<!--
  composer/composer.html — VeilX v5.0 Minimalist Cross-Origin Extension Composer.
  - Runs in `chrome-extension://` origin so ZERO typing events reach Instagram.
  - Communicates EXCLUSIVELY via `chrome.runtime.sendMessage` (`GPV_BROKER_SEND_CIPHERTEXT`),
    NEVER `window.parent.postMessage`, and NEVER sends plaintext across the bridge.
  - Clean, single-line Purplish-Bluish Instagram-inspired pill (no messy inline drawers).
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VeilX Composer</title>
  <link rel="stylesheet" href="composer.css" />
</head>
<body>
  <div class="vx-pill" id="composerPill">
    <button type="button" class="vx-badge-btn" id="statusBtn" title="Click to exchange key or verify safety code">
      <svg class="vx-lock-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <span id="statusLabel">ML-KEM-768</span>
    </button>

    <textarea
      id="composeInput"
      class="vx-input"
      rows="1"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="Message securely with VeilX…"
    ></textarea>

    <span class="vx-counter" id="byteCounter">0 B</span>

    <button type="button" class="vx-send-btn" id="sendBtn" title="Encrypt & Send (Enter)">
      <span>Send</span>
    </button>
  </div>

  <script src="../src/crypto.js"></script>
  <script src="../src/util.js"></script>
  <script src="../src/store.js"></script>
  <script src="composer.js"></script>
</body>
</html>
