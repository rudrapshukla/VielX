<!DOCTYPE html>
<!--
  composer/composer.html — VeilX v1.1.0 Minimalist Cross-Origin Extension Composer.
  - Runs in `chrome-extension://` origin so ZERO typing events reach Instagram.
  - Communicates EXCLUSIVELY via `chrome.runtime.sendMessage` (`VX_BROKER_SEND_CIPHERTEXT`),
    NEVER `window.parent.postMessage`, and NEVER sends plaintext across the bridge.
  - Supports encrypted text, original-quality photos, short videos, live voice notes,
    and a real-time encryption/upload progress bar with ETA.
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>VeilX Composer</title>
  <link rel="stylesheet" href="composer.css" />
</head>
<body>
  <div class="vx-pill" id="composerPill">
    <button type="button" class="vx-badge-btn" id="statusBtn" title="Key status">
      <svg class="vx-lock-svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
      </svg>
      <span id="statusLabel">VeilX</span>
    </button>

    <textarea
      id="composeInput"
      class="vx-input"
      rows="1"
      autocomplete="off"
      autocapitalize="off"
      spellcheck="false"
      placeholder="Message securely with VeilX…"
    ></textarea>

    <span class="vx-counter" id="byteCounter">0 B</span>

    <input
      type="file"
      id="imageInput"
      accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm,video/quicktime,audio/webm,audio/ogg,audio/mp4,audio/mpeg,audio/wav"
      hidden
    />

    <button
      type="button"
      class="vx-voice-btn"
      id="voiceBtn"
      title="Record &amp; send encrypted voice note (1 DM)"
    >
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
        <line x1="12" y1="19" x2="12" y2="23"></line>
        <line x1="8" y1="23" x2="16" y2="23"></line>
      </svg>
      <span id="voiceLabel">Voice</span>
    </button>

    <button
      type="button"
      class="vx-img-btn"
      id="imageBtn"
      title="Encrypt &amp; send original-quality photo, short video, or audio file (up to 15 MB)"
    >
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="18" height="18" rx="3" ry="3"></rect>
        <circle cx="8.5" cy="8.5" r="1.5"></circle>
        <polyline points="21 15 16 10 5 21"></polyline>
      </svg>
      <span>Media</span>
    </button>

    <button type="button" class="vx-send-btn" id="sendBtn" title="Encrypt &amp; Send (Enter)">
      <span>Send</span>
    </button>

    <div class="vx-progress-wrap" id="progressWrap" hidden aria-live="polite">
      <div class="vx-progress-fill" id="progressFill" style="width: 0%"></div>
    </div>
  </div>

  <script src="../src/crypto.js"></script>
  <script src="../src/protocol.js"></script>
  <script src="../src/util.js"></script>
  <script src="../src/store.js"></script>
  <script src="../src/session.js"></script>
  <script src="composer.js"></script>
</body>
</html>
